name: Swift Compatibility

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: swift-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This package has no macOS support (AVAudioSession is unavailable there) so
# tests run on an iOS simulator via xcodebuild instead of `swift test`.

jobs:
  swift-6-0:
    name: Swift 6.0 compatibility
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      # Only the library is built here. This job guards the minimum Swift
      # version the package claims to support, which is a promise about the
      # code consumers compile. The test target is exercised by the
      # current-swift job instead. The package has no macOS support, so this
      # cannot be a plain `swift build` against the host, and the runner image
      # carries no iOS 18 simulator runtime for Xcode 16.0, so it cannot be a
      # simulator test either.
      - name: Build for iOS
        run: >-
          xcodebuild build
          -scheme OEVoice
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  current-swift:
    name: Current Swift tests and platform builds
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select an iOS simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test on iOS
        run: >-
          xcodebuild test
          -scheme OEVoice
          -destination "id=${{ steps.simulator.outputs.udid }}"

      - name: Build for iOS
        run: >-
          xcodebuild build
          -scheme OEVoice
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build for tvOS
        run: >-
          xcodebuild build
          -scheme OEVoice
          -destination 'generic/platform=tvOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build for watchOS
        run: >-
          xcodebuild build
          -scheme OEVoice
          -destination 'generic/platform=watchOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build for visionOS
        run: >-
          xcodebuild build
          -scheme OEVoice
          -destination 'generic/platform=visionOS'
          CODE_SIGNING_ALLOWED=NO
